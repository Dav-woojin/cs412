<!-- this is our alljokes.html file to display all jokes -->

{%extends 'dadjokes/base.html' %}

{%block content%}

<main class = "grid-container">
    {%for joke in jokes%}
    <article>
        <div>
            <p>{{joke.text}}</p>
            <p>by {{joke.name}}</p><br>
        </div>

        
    </article>
    <!-- <hr> -->
    {%endfor%}
</main>

{%endblock%}
