<!-- this template manages the work of deleting posts, and providing the options to confirm and cancel -->

{% extends 'mini_insta/base.html' %}
 
{% block content %}
<!-- templates/blog/delete_comment.html -->
 
<h3>Are you sure you want to delete this post?</h3>
 
<p>
{{post}}
</p>
 
<form method='POST'>
    {% csrf_token %}
    <input type='submit' value="Confirm">
</form>
 
 
<form action = "{% url 'show_profile' profile.pk %}" method ='GET'>
    {% csrf_token %}
    <input type='submit' value="Cancel">
</form>
 
 
{% endblock %}
