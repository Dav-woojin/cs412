{%extends 'mini_insta/base.html' %}

{%block content%}

<main class = "grid-container">
    <table>
        <h1>{{post.profile}}'s Post</h1>
        {% for photo in post.get_all_photos %}
            <li><img src="{{ photo.image_url }}" height = "300" width="300"></li>
            
        {% endfor %}
        <div>
            <p>{{post.caption}}
                at {{post.timestamp}}</p>
        </div>
    </table>
    <hr>
</main>

{% endblock %}
