<!-- This is our show all profiles html template, which is meant to iterate through
     all users and present all of the profiels on one page -->

{%extends 'mini_insta/base.html' %}

{%block content%}

<main class = "grid-container">
    {%for profile in profiles%}
    <article>
        <div>
            <h2>{{profile.username}}</h2>
            <h3>by {{profile.display_name}}</h3>
        </div>

        <a href = "{% url 'show_profile' profile.pk %}">
        <img src = "{{profile.profile_image_url}}">
        </a>

        
    </article>
    <hr>
    {%endfor%}
</main>

{%endblock%}
